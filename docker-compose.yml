services:
  postgres:
    image: postgres:16
    container_name: weaksignals-postgres
    environment:
      POSTGRES_USER: weaksignals
      POSTGRES_PASSWORD: weaksignals
      POSTGRES_DB: weaksignals
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: weaksignals-backend
    ports:
      - "8000:8000"
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgresql://weaksignals:weaksignals@postgres:5432/weaksignals
    volumes:
      - ./backend:/app
      - ./config:/app/config
      - ./data:/app/data
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  pgdata: